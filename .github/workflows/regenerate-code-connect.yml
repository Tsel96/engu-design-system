name: Sync icons + Code Connect from Figma

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: Figma event that requested this sync
        required: false
        default: manual
  repository_dispatch:
    types: [FILE_UPDATE, LIBRARY_PUBLISH]
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches: [main]
    paths: ['scripts/generate-code-connect.js', 'scripts/current-icon-sets.js', 'scripts/export-figma-icons.js', '.github/workflows/regenerate-code-connect.yml']

permissions:
  contents: write

concurrency:
  group: figma-sync-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export icon assets
        run: node scripts/export-figma-icons.js
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      - name: Generate mappings for live Figma components
        run: npm run generate
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      - name: Commit generated assets and mappings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/icons/ code-connect/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync icons and Code Connect from Figma'
            git push
          fi
      # GITHUB_TOKEN pushes do not trigger the separate push workflow.
      - name: Publish Code Connect in this run
        run: npm run publish
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
