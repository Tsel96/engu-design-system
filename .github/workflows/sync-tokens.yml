name: Verify Figma token snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tokens/**', 'colors_and_type.css', 'scripts/**', 'figma-plugin/**', 'tests/**', 'package.json', '.github/workflows/sync-tokens.yml']
  pull_request:
    paths: ['tokens/**', 'colors_and_type.css', 'scripts/**', 'figma-plugin/**', 'tests/**', 'package.json', '.github/workflows/sync-tokens.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:tokens
      - run: npm run check:plugin
