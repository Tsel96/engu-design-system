name: Publish Figma Code Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code-connect/**', 'figma.config.json']

permissions:
  contents: read

concurrency:
  group: figma-sync-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run publish
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
